workflows:
  ios-release:
    name: Courier App Release
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "Apple Key" # <--- ВАЖНО: Напишите здесь точное имя ключа из Шага 1!
    environment:
      xcode: latest
    scripts:
      - name: Инициализация связки ключей (Keychain)
        script: keychain initialize
        
      - name: Выпуск и скачивание сертификатов из Apple
        script: app-store-connect fetch-signing-files "restify.CourierApp" --type IOS_APP_STORE --create
        
      - name: Установка сертификатов на виртуальный Mac
        script: keychain add-certificates
        
      - name: Привязка профилей к проекту Xcode
        script: xcode-project use-profiles
        
      - name: Сборка приложения (Build IPA)
        script: |
          PROJECT_PATH=$(find . -name "*.xcodeproj" | head -n 1)
          xcode-project build-ipa \
            --project "$PROJECT_PATH" \
            --scheme "CourierApp"
    artifacts:
      - build/ios/ipa/*.ipa
